spring.application.name=TripNest
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-a-random-64-character-value-before-deploying}
app.jwt.expiration-ms=86400000

# React Frontend
app.cors.origin=http://localhost:5173

# Demo Data
app.seed.enabled=false
app.seed.admin-password=Admin@123
app.seed.customer-password=Customer@123
